<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/favicon.ico">
  <title>Menu</title>
</head>
<body id="body" class="light">
  <header class="header drop-shadow">
    <div class="flex-row main-container header__container">
      <h1 class="font-title-1"><a href="index.html">CoffeeShop</a></h1>
      <nav class="desktop">
        <ul class="flex-row gap-60">
          <li><a class="font-body accent-text" href="index.html#menu">Menu</a></li>
          <li><a class="font-body accent-text" href="index.html#specialOffers">Special Offers</a></li>
          <li><a class="font-body accent-text" href="index.html#aboutUs">About Us</a></li>
          <li><a class="font-body accent-text" href="index.html#visitUs">Visit Us</a></li>
        </ul>
      </nav>
      <div class="flex-row gap-30">
        <button class="main-button desktop" onclick="window.location.href='menu.html'">Menu</button>
        <button class="icon-button" onclick="changeTheme()" id="themeButton"><img src="assets/images/dark-theme.svg" alt="Change theme" id="themeButtonIcon"></button>
      </div>
    </div>
  </header>
  <main class="flex-col gap-30">
    <div class="backdrop" id="backdrop">
      <div class="flex-row gap-20 modal-window drop-shadow" id="modalWindow">
      </div>
    </div>
    <section class="main-container top-section">
      <div class="flex-col gap-10">
        <h1 class="font-title-1">Menu</h1>
        <p class="font-title-2">What will you wish for?</p>
      </div>
    </section>
    <section class="main-container flex-row gap-30 pins">
      <button class="pin active" id="drinksPin">Drinks</button>
      <button class="pin" id="dessertsPin">Desserts</button>
      <button class="pin" id="setsPin">Sets</button>
    </section>
    <section id="desserts">
      <div class="menu-section-heading">
        <div class="menu-section-heading-line left"></div>
        <h2 class="font-title-1" id="menuTitle">Drinks</h2>
        <div class="menu-section-heading-line right"></div>
      </div>
      <div class="main-container">
        <div class="flex-row gap-30 menu-grid" id="menuGrid">
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="flex-row main-container">
      <div class="flex-col gap-10">
        <p class="font-title-1 white-text">CoffeeShop</p>
        <p class="font-body white-text">742 Evergreen Terrace, Brooklyn, NY 11211</p>
        <p class="font-body white-text">7:30 AM – 8:00 PM</p>
      </div>
      <p class="font-body white-text">© 2026 CoffeeShop</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
